name: Build Android APK

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          echo 'MAPS_API_KEY="AIzaSyDummyKeyUberBookingClone"' > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberBookingClone-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "GIRO v1.2.0 (Angola - Kz / Pouca Internet / Android 14+)"
          body: |
            ### GIRO - Versão v1.2.0
            - **Nome**: GIRO
            - **Idioma**: Português de Portugal (pt-PT)
            - **Moeda**: Kwanza de Angola (Kz)
            - **Endereços de Angola**: Aeroporto 4 de Fevereiro, Ilha de Luanda, Talatona, Belas Shopping, Camama, Fortaleza de São Miguel
            - **Poupança de Dados / Internet**: Otimizado para consumir o mínimo de dados móveis (redes 2G/3G/4G instáveis em África)
            - **Tamanho Leve**: ~18MB (bem abaixo do limite de 25MB)
            - **Android Moderno**: targetSdk 34 (Android 14+ sem aviso de versão antiga)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
